<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Cairo:wght@400;600;700;800&family=Changa:wght@400;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f8;--card:#fff;--b:#e5e7ee;--t:#161b2e;--m:#6b7388;--p:#4f46e5;--p2:#eef2ff;--r:14px;--sh:0 1px 2px #1b24400a,0 4px 14px #1b24400a}
*{box-sizing:border-box;margin:0;font-family:Cairo,Tahoma,sans-serif}
body{background:var(--bg);color:var(--t);font-size:15px}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 15px;font-size:14px;font-weight:700;background:var(--p);color:#fff;transition:.15s}
button:hover{filter:brightness(1.08)}button.g{background:#fff;color:var(--t);border:1px solid var(--b)}button.d{background:#dc2626}button.s{padding:5px 10px;font-size:12.5px}button.x{background:var(--p2);color:var(--p)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--b);border-radius:10px;font-size:14px;background:#fff;color:var(--t)}
textarea{resize:vertical}input[type=color]{padding:2px;height:38px}
.fl{margin-bottom:10px}.fl label,label.l{font-size:12.5px;color:var(--m);display:block;margin-bottom:4px;font-weight:600}
label.ck{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0;cursor:pointer}label.ck input{width:auto}
.layout{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:#fff;border-left:1px solid var(--b);padding:14px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-size:19px;font-weight:800;padding:2px 8px 12px;color:var(--p)}
.box{background:var(--p2);border-radius:12px;padding:10px;margin-bottom:12px}
.nv{display:flex;align-items:center;gap:9px;width:100%;text-align:right;background:none;color:#414a63;padding:9px 11px;margin-bottom:2px;border-radius:10px;font-weight:600}
.nv.on{background:var(--p2);color:var(--p)}.nv:hover{background:#f3f4f8;filter:none}.nv .n{margin-right:auto;background:#ef4444;color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
.sec-t{font-size:11px;color:var(--m);padding:10px 11px 4px;font-weight:700}
main{padding:28px;max-width:1440px;width:100%}
h2{font-size:22px;font-weight:800}h3{font-size:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.k{color:var(--m);font-size:12.5px;font-weight:600}.v{font-size:26px;font-weight:800;margin-top:2px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:16px}
.sites{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.site{padding:0;overflow:hidden}.site .hd{height:84px;display:flex;align-items:flex-end;padding:12px 14px;color:#fff;font-weight:800;font-size:19px;gap:8px}
.site .bd{padding:13px 14px}.site small{color:var(--m);display:block;margin-bottom:9px;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap}.row.sp{justify-content:space-between;align-items:center}.row>.fl{flex:1;min-width:110px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--b);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--b);vertical-align:middle;font-size:13.5px}
th{background:#f8f9fc;color:var(--m);font-weight:700;font-size:12.5px}tr.cl{cursor:pointer}tr.cl:hover td{background:#fafbff}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#e5e7eb;margin:1px}
.help{background:#f0f9ff;border:1px solid #bae6fd;border-radius:12px;padding:10px 13px;font-size:13px;margin-bottom:14px;color:#075985;line-height:1.7}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:#fff;color:var(--t);border:1px solid var(--b)}.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.mo{position:fixed;inset:0;background:#0b122a8c;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.mb{background:#fff;border-radius:18px;padding:20px;width:min(620px,100%);max-height:92vh;overflow:auto}.mb.w{width:min(820px,100%)}
.mb>h3{margin-bottom:10px;font-size:18px}
.bar{height:8px;border-radius:9px;background:#eef0f5;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px}
.li{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--b);border-radius:11px;margin-bottom:6px;background:#fff}
.li .grow{flex:1}.sm{font-size:12px;color:var(--m)}
.ed{display:grid;grid-template-columns:390px 1fr;gap:14px;align-items:start}
.ed .ctl{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.pvw{background:#dfe3ec;border-radius:16px;padding:10px;max-height:calc(100vh - 24px);overflow:auto;position:sticky;top:12px}
.pvw .frame{margin:0 auto;background:#fff;border-radius:10px;overflow:clip;transition:.2s}
.pvw.mob .frame{width:390px;max-width:100%}
.evl{font-size:12px;font-family:monospace;background:#0f172a;color:#a5f3fc;border-radius:10px;padding:8px;max-height:130px;overflow:auto;direction:ltr;text-align:left}
.snip{border:1px solid var(--b);border-radius:10px;padding:10px;direction:ltr;text-align:left;background:#fff}.snip b{color:#1a0dab;font-weight:400;font-size:17px;display:block}.snip i{color:#006621;font-style:normal;font-size:12.5px}.snip p{font-size:13px;color:#4d5156}
/* ===== Storefront ===== */
.sf{position:fixed;inset:0;z-index:40;background:#fff;overflow:auto}
.sfbar{background:#0f172a;color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;position:sticky;top:0;z-index:30;gap:8px}.sfbar button{padding:6px 12px;font-size:13px}
.pm{position:fixed;inset:0;background:#0b122a99;z-index:70;display:flex;align-items:center;justify-content:center;padding:12px}.pm .mb{width:min(720px,100%)}
.thumb{width:72px;height:48px;border-radius:8px;border:1px dashed #cfd3df;background:#f3f4f8 center/cover;flex:none;position:relative}
.thg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.thc{border:2px solid var(--b);border-radius:14px;padding:8px;cursor:pointer;background:#fff;transition:.15s}.thc:hover{border-color:var(--p);transform:translateY(-2px)}
.thc b{display:block;font-size:13.5px;margin-top:6px}.thp{border-radius:10px;padding:7px;border:1px solid #0001}.thr{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:5px}.thr i{display:block;height:24px}
.swr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.swr span{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--b)}
.dl-st{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}.pt{max-width:560px;margin:0 auto;padding:14px}.pt .card{margin-bottom:10px}
.gimg{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.gimg .gi{width:84px;height:84px;border-radius:10px;background:#f3f4f8 center/cover;position:relative;border:2px solid transparent}.gimg .gi.m{border-color:var(--p)}
.gimg .gi button{position:absolute;top:3px;left:3px;padding:0 6px;font-size:12px;border-radius:99px;background:#dc2626}.gimg .gi span{position:absolute;bottom:3px;right:3px;font-size:10px;background:var(--p);color:#fff;border-radius:99px;padding:0 6px}
/* --- أساس الموقع --- */
.sfw{background:var(--bg);color:var(--tx);line-height:1.65;container:sf/inline-size;-webkit-font-smoothing:antialiased}
.sfw *{font-family:inherit}.sfw h1,.sfw h2,.sfw h3{font-family:var(--hf,inherit);line-height:1.3}
.sfw .ann{text-align:center;padding:8px 14px;font-size:13.5px;font-weight:700}
.sfw header{display:flex;align-items:center;gap:12px;padding:14px 24px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid color-mix(in srgb,var(--tx) 10%,transparent)}
.sfw header .lg{flex:1;font-weight:800;font-size:21px;color:var(--c);display:flex;align-items:center;gap:8px;cursor:pointer}.sfw header .lg img{height:36px;border-radius:8px}
.sfw header .ctl{display:flex;gap:8px;align-items:center}
.sfw header select,.sfw header button{width:auto;padding:6px 12px;font-size:13px;border-radius:99px;background:color-mix(in srgb,var(--tx) 8%,transparent);color:var(--tx);border:0}
.sfw.hd-center header{flex-direction:column;gap:8px}.sfw.hd-center header .lg{flex:none;justify-content:center}
.sfw .hero{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff;padding:84px 24px;text-align:center}
.sfw .hero h1{font-size:clamp(28px,5.4cqi,54px);font-weight:800;margin-bottom:6px}.sfw .hero p{opacity:.93;margin:10px auto 24px;font-size:clamp(15px,2cqi,19px);max-width:620px}
.sfw .hero.start p{margin-inline:0}
.sfw .hero.split,.sfw .hero.splitrev{display:grid;grid-template-columns:1.15fr 1fr;align-items:center;text-align:start;gap:30px;padding-inline:max(24px,8%)}.sfw .hero.splitrev{grid-template-columns:1fr 1.15fr}.sfw .hero.split p,.sfw .hero.splitrev p{margin-inline:0}
.sfw .hero.start{text-align:start;padding-inline:max(24px,8%)}
.sfw .hero .big{display:flex;align-items:center;justify-content:center;min-height:260px;background-size:cover;background-position:center;border-radius:var(--r)}
.sfw .hero .cta{background:#fff;color:var(--c);padding:14px 34px;font-size:16px;border-radius:var(--r);box-shadow:0 8px 24px #0003}
.sfw .sec{max-width:var(--w,1180px);margin:0 auto;padding-inline:20px}.sfw .sec>h2,.sfw .sec #sf-prods>h2{font-size:clamp(22px,3.4cqi,32px);font-weight:800;margin-bottom:22px;text-align:inherit}
.sfw .sec>h2::after,.sfw .sec #sf-prods>h2::after{content:"";display:block;width:46px;height:4px;border-radius:9px;background:var(--c);margin:10px auto 0}.sfw .sec[style*="start"]>h2::after{margin-inline:0}
/* --- قوائم المنتجات --- */
.sfw .pg{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:20px;align-items:stretch}
.sfw .pc{display:flex;flex-direction:column;border:1px solid color-mix(in srgb,var(--tx) 11%,transparent);border-radius:var(--r);overflow:hidden;background:var(--cb);cursor:pointer;transition:.22s}
.sfw .pc:hover{transform:translateY(-3px);box-shadow:0 14px 30px #0000001f}
.sfw .pc .im{position:relative;display:flex;align-items:center;justify-content:center;font-size:64px;aspect-ratio:var(--ar,1/1);background-size:var(--fit,cover);background-position:center;background-repeat:no-repeat}.sfw .pc.tall .im{aspect-ratio:3/4}
.sfw .pc .bd{padding:14px;display:flex;flex-direction:column;flex:1;gap:3px}.sfw .pc h3{font-size:15.5px;font-weight:700}
.sfw .rt{font-size:12.5px;color:#f59e0b;display:flex;gap:4px;align-items:center}.sfw .rt span{color:var(--tx);opacity:.6}
.sfw .pr{font-weight:800;color:var(--c);font-size:17px;margin:4px 0}.sfw .pr s{color:var(--tx);opacity:.45;font-weight:400;font-size:13px;margin-inline:8px}
.sfw .b{width:100%;background:var(--c);color:#fff;padding:11px;border-radius:calc(var(--r) - 3px);margin-top:auto;font-size:14.5px}.sfw .b:disabled{background:#9ca3af}
.sfw .badge{position:absolute;top:10px;inset-inline-start:10px;background:#ef4444;color:#fff;font-size:12px;padding:3px 10px;border-radius:99px;font-weight:700}
.sfw .low{font-size:12.5px;font-weight:700;margin:2px 0 6px}.sfw .cd{font-size:12.5px;color:#d97706;font-weight:700;margin:2px 0 6px}
.sfw .pc.h{display:grid;grid-template-columns:150px 1fr}.sfw .pc.h .im{aspect-ratio:auto;min-height:150px;height:100%;font-size:46px}
.sfw .feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;text-align:center}.sfw .feat div{background:color-mix(in srgb,var(--tx) 5%,transparent);border-radius:var(--r);padding:22px 14px;font-weight:700}.sfw .feat span{font-size:32px;display:block;margin-bottom:6px}
.sfw .rv{background:color-mix(in srgb,var(--tx) 5%,transparent);border-radius:var(--r);padding:16px;text-align:start}.sfw .rv .st,.sfw .stars{color:#f59e0b;letter-spacing:1px}.sfw .rv p{margin:6px 0;font-size:14.5px}
.sfw details{border:1px solid color-mix(in srgb,var(--tx) 13%,transparent);border-radius:calc(var(--r) - 2px);padding:14px 16px;margin-bottom:10px;text-align:start}.sfw summary{cursor:pointer;font-weight:700}.sfw details p{margin-top:8px;opacity:.82}
.sfw footer{text-align:center;opacity:.8;padding:40px 16px;font-size:13px;border-top:1px solid color-mix(in srgb,var(--tx) 11%,transparent);margin-top:44px}
.sfw .wa{display:inline-block;background:#16a34a;color:#fff;padding:12px 26px;border-radius:var(--r);font-weight:700;text-decoration:none;margin:10px}
.sfw .sub{display:flex;gap:8px;max-width:380px;margin:12px auto}.sfw .sub input{background:var(--cb);color:var(--tx)}
.sfw .ban{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center;text-align:start}.sfw .ban.nob{grid-template-columns:1fr;text-align:center}.sfw .ban .bi{min-height:260px;border-radius:var(--r);background-size:cover;background-position:center}
.sfw .cta2{display:inline-block;background:var(--c);color:#fff;padding:12px 28px;border-radius:var(--r);text-decoration:none;font-weight:700;margin-top:12px}
.sfw.btn-outline .b,.sfw.btn-outline .sb,.sfw.btn-outline .stk button{background:transparent;color:var(--c);border:2px solid var(--c)}.sfw.btn-outline .b:disabled{color:#9ca3af;border-color:#9ca3af}
.sfw.btn-pill .b,.sfw.btn-pill .cta,.sfw.btn-pill .sb,.sfw.btn-pill .cta2,.sfw.btn-pill .stk button{border-radius:99px}
.sfw.sh-soft .pc{box-shadow:0 4px 16px #0000000f}.sfw.sh-strong .pc{box-shadow:0 10px 30px #00000026}
/* --- صفحة المنتج / الهبوط --- */
.sfw .pp{max-width:var(--w,1180px);margin:0 auto;padding:22px 20px 20px}.sfw .crumb{font-size:13px;opacity:.7;margin-bottom:16px;cursor:pointer;display:inline-block}
.sfw .ppg{display:grid;grid-template-columns:1.05fr 1fr;gap:38px;align-items:start}
.sfw .gal .main{position:relative;aspect-ratio:var(--ar,1/1);border-radius:var(--r);background-size:var(--fit,cover);background-position:center;background-repeat:no-repeat;display:flex;align-items:center;justify-content:center;font-size:130px;overflow:hidden;background-color:var(--cb)}
.sfw .thr2{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.sfw .th2{flex:none;width:72px;height:72px;border-radius:calc(var(--r)*.6);background:center/cover;background-color:var(--cb);cursor:pointer;border:2px solid transparent;opacity:.75;display:flex;align-items:center;justify-content:center;font-size:24px}.sfw .th2.on{border-color:var(--c);opacity:1}
.sfw .buy{position:sticky;top:80px}.sfw .buy h1{font-size:clamp(23px,3.4cqi,34px);font-weight:800;margin-bottom:6px}.sfw .rate{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px}
.sfw .ppr{font-size:30px;font-weight:800;color:var(--c)}.sfw .ppr s{font-size:17px;opacity:.45;font-weight:400;margin-inline:10px}
.sfw .opt{margin:12px 0}.sfw .opt label{font-size:13px;opacity:.75;display:block;margin-bottom:6px;font-weight:700}.sfw .opt button{margin:0 0 6px 6px;background:var(--cb);color:var(--tx);border:1px solid color-mix(in srgb,var(--tx) 20%,transparent);padding:8px 16px;border-radius:99px;font-weight:600}.sfw .opt button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c)}
.sfw .obox{margin-top:16px;padding:18px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--tx) 13%,transparent);background:var(--cb)}.sfw .obox>b{font-size:16px;display:block;margin-bottom:12px}
.sfw .fx{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sfw .fx .full{grid-column:1/-1}.sfw .fx label{font-size:12.5px;opacity:.75;display:block;margin-bottom:3px;font-weight:600}
.sfw .fx input,.sfw .fx textarea,.sfw .fx select,.sfw .rform input,.sfw .rform select,.sfw .rform textarea{background:var(--bg);color:var(--tx);border:1px solid color-mix(in srgb,var(--tx) 18%,transparent);border-radius:calc(var(--r)*.7);padding:11px 12px}
.sfw .tot{background:color-mix(in srgb,var(--tx) 5%,transparent);border-radius:calc(var(--r)*.8);padding:12px 14px;margin:12px 0}.sfw .tot div{display:flex;justify-content:space-between;padding:3px 0}
.sfw .sb{width:100%;background:var(--c);color:#fff;padding:15px;font-size:17px;border-radius:var(--r);margin-top:4px}
.sfw .trust{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;opacity:.85;margin-top:12px}
.sfw .stk{position:sticky;bottom:0;z-index:15;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--bg);border-top:1px solid color-mix(in srgb,var(--tx) 12%,transparent);box-shadow:0 -8px 24px #0000001a}.sfw .stk .ppr{flex:1;font-size:19px}.sfw .stk button{padding:13px 30px;border-radius:var(--r);background:var(--c);color:#fff;font-size:15px}
.sfw .bp{margin-top:52px}.sfw .bp>h2{font-size:clamp(22px,3.2cqi,30px);margin-bottom:20px;text-align:center;font-weight:800}
.sfw .benef{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.sfw .benef div{display:flex;gap:10px;align-items:flex-start;padding:16px;border-radius:var(--r);background:color-mix(in srgb,var(--c) 9%,transparent);font-weight:600}
.sfw .story{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;margin-bottom:34px}.sfw .story.rev .sim{order:2}.sfw .story h3{font-size:22px;margin-bottom:8px}.sfw .story p{white-space:pre-wrap;opacity:.88}.sfw .story.nim{grid-template-columns:1fr}
.sfw .sim{aspect-ratio:4/3;border-radius:var(--r);background:center/cover}
.sfw .vid{position:relative;aspect-ratio:16/9;border-radius:var(--r);background:#0f172a center/cover;display:flex;align-items:center;justify-content:center;color:#fff;font-size:60px;cursor:pointer;overflow:hidden}.sfw .vid iframe,.sfw .vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
.sfw .vids{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.sfw .rsum{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:center;margin-bottom:20px}.sfw .rsum .big{font-size:46px;font-weight:800;line-height:1}.sfw .rbar{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:3px 0}.sfw .rbar i{flex:1;height:8px;border-radius:9px;background:color-mix(in srgb,var(--tx) 11%,transparent);overflow:hidden;display:block}.sfw .rbar i b{display:block;height:100%;background:#f59e0b}
.sfw .rvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.sfw .rph{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.sfw .rph div{width:68px;height:68px;border-radius:8px;background:center/cover}
.sfw .vf{font-size:11.5px;color:#16a34a;font-weight:700}
.sfw .rform{margin-top:18px;padding:18px;border-radius:var(--r);background:color-mix(in srgb,var(--tx) 5%,transparent)}.sfw .rform>b{display:block;margin-bottom:10px}
/* --- استجابة حسب عرض الإطار (تشتغل بمعاينة الموبايل كمان) --- */
@container sf (max-width:1000px){.sfw .pg{grid-template-columns:repeat(min(var(--cols),3),minmax(0,1fr))}}
@container sf (max-width:760px){
 .sfw header{padding:10px 14px}.sfw header .lg{font-size:18px}.sfw header .lg img{height:30px}
 .sfw .hero{padding:44px 18px}.sfw .hero.split,.sfw .hero.splitrev{grid-template-columns:1fr;text-align:center;gap:18px;padding:36px 18px}.sfw .hero.split p,.sfw .hero.splitrev p{margin-inline:auto}.sfw .hero .big{min-height:190px}.sfw .hero.start{padding-inline:18px}

  const m=S.payMethods.find(q=>q.id===OF.pay)||{name:''},msg=encodeURIComponent(`طلب جديد #${o.no}\n${items.map(i=>i.name+(i.opts?' ('+i.opts+')':'')+' × '+i.qty).join('\n')}\nالإجمالي: ${fp(o.total)}\nالدفع: ${m.name}\nالاسم: ${o.name}\nالهاتف: ${o.phone}\n${c.name} - ${o.gov} - ${o.area}\n${o.address}${o.cnote?'\nملاحظات: '+o.cnote:''}`);
  SF.page='thanks';SF.thanksId=o.id;SF.thanksMsg=msg;window._nokeep=true;drawSF();scrollTop();if(LIVE.mode==='store')history.pushState({},'','/thanks'+location.search);
  if(LIVE.mode==='admin')lvFlush().then(()=>liveReload(true)).catch(()=>{})};
